name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-scheduling-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run bounded finite checks and exact campaign comparison
        shell: bash
        run: |
          mkdir -p scientific-output
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 900s bash -euo pipefail <<'CHECKS' 2>&1 | tee scientific-output/run.log
          ulimit -v 3145728
          ulimit -t 900
          python -B tests/test_transition_cache.py -v
          python -B tests/validation.py scientific-output/validation.json
          python -B tests/reset_conditions.py scientific-output/reset-conditions.json
          python -B tests/exchange_conditions.py scientific-output/exchange-conditions.json
          python -B tests/pairing_boundary.py scientific-output/pairing-boundary.json
          python -B tests/unrestricted_grid.py scientific-output/unrestricted-grid-validation.json
          python -B scripts/check_source_schemas.py --output scientific-output/source-schemas.json
          python -B scripts/run_unrestricted_baseline.py scientific-output/unrestricted-baseline.json
          python -B scripts/run_campaign.py --output scientific-output/campaign
          python -B scripts/compare_results.py results/campaign scientific-output/campaign
          python -B scripts/export_paper_data.py --output scientific-output/figure-sources
          python -B scripts/check_reproduction.py --paired-only --campaign scientific-output/campaign --figure-sources scientific-output/figure-sources --output scientific-output/paired-comparison.json
          python -B scripts/check_bibliography.py --output scientific-output/bibliography-integrity.json
          python -B scripts/check_repository_integrity.py --output scientific-output/repository-integrity.json
          CHECKS
      - name: Upload raw scientific output, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-output
          path: scientific-output/
          if-no-files-found: warn
          retention-days: 14
